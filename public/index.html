<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tetris Multiplayer</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="home-screen">
    <h1 class="title">Tetris Multiplayer</h1>

    <section class="home-panel">
      <label for="display-name">Display name</label>
      <input id="display-name" type="text" maxlength="20" placeholder="Enter your name" autocomplete="off" />
      <p id="name-error" class="field-error" hidden>Enter a display name first.</p>
    </section>

    <section class="home-panel">
      <button id="create-room-btn" class="primary-btn">Create Room</button>
    </section>

    <section class="home-panel">
      <label for="room-code-input">Room code</label>
      <input id="room-code-input" type="text" maxlength="6" placeholder="e.g. ABCDE" autocomplete="off" />
      <button id="join-room-btn" class="secondary-btn">Join Room</button>
      <p id="code-error" class="field-error" hidden>Enter a valid room code.</p>
    </section>
  </main>
  <script src="/home.js" defer></script>
  <script src="/room.js" defer></script>
</body>
</html>
